<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semanário Digital</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Semanário Digital</h1>
        <p>Educação Infantil</p>
    </header>

   <main>
    <section aria-labelledby="titulo-planejamento">
        <h2 id="titulo-planejamento">Planejamento semanal</h2>
        <p>Preencha e acompanhe os registros da turma durante toda a semana.</p>

        <form>
            <div class="grade-identificacao">
                <div class="campo">
                    <label for="professora">Professora</label>
                    <input type="text" id="professora" name="professora">
                </div>

                <div class="campo">
                    <label for="turma">Turma</label>
                    <input type="text" id="turma" name="turma">
                </div>

                <div class="campo">
                    <label for="periodo">Período</label>
                    <select id="periodo" name="periodo">
                        <option value="">Selecione</option>
                        <option value="manha">Manhã</option>
                        <option value="tarde">Tarde</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="ciclo">Ciclo</label>
                    <select id="ciclo" name="ciclo">
                        <option value="">Selecione</option>
                        <option value="bercario">Berçário</option>
                        <option value="inicial">1º Inicial</option>
                        <option value="final">1º Final</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="inicio-semana">Início da semana</label>
                    <input type="date" id="inicio-semana" name="inicio_semana">
                </div>
            </div>
                        <section class="semana" aria-labelledby="titulo-dias">
                <h3 id="titulo-dias">Registros da semana</h3>

                <div class="dias-semana">
                    {% for dia in dias %}
                    <article class="dia">
                        <h4>{{ dia }}</h4>

                        <div class="campo">
                            <label for="proposta-{{ loop.index }}">Proposta</label>
                            <textarea id="proposta-{{ loop.index }}"
                                      name="proposta_{{ loop.index }}"
                                      rows="3"></textarea>
                        </div>

                        <div class="campo">
                            <label for="intencionalidade-{{ loop.index }}">Intencionalidade</label>
                            <textarea id="intencionalidade-{{ loop.index }}"
                                      name="intencionalidade_{{ loop.index }}"
                                      rows="3"></textarea>
                        </div>

                        <div class="campo">
                            <label for="desenvolvimento-{{ loop.index }}">Desenvolvimento</label>
                            <textarea id="desenvolvimento-{{ loop.index }}"
                                      name="desenvolvimento_{{ loop.index }}"
                                      rows="3"></textarea>
                        </div>

                        <div class="campo">
                            <label for="observacao-{{ loop.index }}">Observação / Replanejamento</label>
                            <textarea id="observacao-{{ loop.index }}"
                                      name="observacao_{{ loop.index }}"
                                      rows="3"></textarea>
                        </div>

                        <div class="campo">
                            <label for="registro-{{ loop.index }}">Registro Reflexivo</label>
                            <textarea id="registro-{{ loop.index }}"
                                      name="registro_{{ loop.index }}"
                                      rows="3"></textarea>
                        </div>
                    </article>
                    {% endfor %}
                </div>
            </section>
        </form>
    </section>
</main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
