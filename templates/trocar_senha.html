<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocar senha | Semanário Digital</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
        <script
        src="{{ url_for('static', filename='js/senha.js') }}"
        defer
    ></script>
</head>
<body class="pagina-login">
    <main class="cartao-login">
        <div class="marca-login">
            <h1>Semanário Digital</h1>
            <p>Educação Infantil</p>
        </div>

        <section aria-labelledby="titulo-troca-senha">
            <h2 id="titulo-troca-senha">Crie uma nova senha</h2>

            <p>
                Olá, {{ session["usuario_nome"] }}.
                Por segurança, altere a senha provisória antes de continuar.
            </p>

            {% if erro %}
                <p class="mensagem erro" role="alert">
                    {{ erro }}
                </p>
            {% endif %}

            <form method="post" class="form-login">
                <div class="campo">
                    <label for="nova-senha">Nova senha</label>
                    <input
                        type="password"
                        id="nova-senha"
                        name="nova_senha"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                    <small>Utilize pelo menos 8 caracteres.</small>
                </div>

                <div class="campo">
                    <label for="confirmar-senha">
                        Confirme a nova senha
                    </label>
                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar_senha"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>
                                <label class="controle-senha">
                    <input
                        type="checkbox"
                        data-mostrar-senha="nova-senha, confirmar-senha"
                    >
                    Mostrar senhas
                </label>

                <button type="submit">
                    Salvar nova senha
                </button>
            </form>
        </section>
    </main>
</body>
</html>
