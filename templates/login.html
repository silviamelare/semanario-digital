<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Semanário Digital</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>
    <script
        src="{{ url_for('static', filename='js/senha.js') }}"
        defer
    ></script>
<body class="pagina-login">
    <main class="cartao-login">
        <div class="marca-login">
            <h1>Semanário Digital</h1>
            <p>Educação Infantil</p>
        </div>

        <section aria-labelledby="titulo-login">
            <h2 id="titulo-login">Entrar</h2>
            <p>Utilize seu RF e sua senha para acessar o sistema.</p>

            {% if erro %}
                <p class="mensagem erro" role="alert">
                    {{ erro }}
                </p>
            {% endif %}

            <form method="post" class="form-login">
                <div class="campo">
                    <label for="rf">RF</label>
                    <input
                        type="text"
                        id="rf"
                        name="rf"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <label class="controle-senha">
                    <input
                        type="checkbox"
                        data-mostrar-senha="senha"
                    >
                    Mostrar senha
                </label>
                
                <button type="submit">
                    Entrar
                </button>
            </form>
        </section>
    </main>
</body>
</html>
